<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VG Generator — tnks1407</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf6fb; --surface: #fff0f8; --surface2: #fce8f4;
      --border: #f0c8e0; --accent1: #c87ec0; --accent2: #e86fa0;
      --accent3: #5bbfb0; --text: #3d2848; --text-muted: #9a7aaa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: rgba(253,246,251,0.92); backdrop-filter: blur(12px);
      border-bottom: 1.5px solid var(--border); padding: 0 1.5rem;
      position: sticky; top: 0; z-index: 10;
    }
    .header-inner { max-width: 960px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1rem; font-weight: 800; background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo-sub { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem; }
    @media (max-width: 680px) { main { grid-template-columns: 1fr; } }

    .panel { background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(200,126,192,0.08); }
    h2 { font-size: 1rem; font-weight: 800; margin-bottom: 1.25rem; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tab { flex: 1; padding: 0.45rem; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .tab.active { background: var(--accent1); border-color: var(--accent1); color: #fff; }

    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace; }
    .field-row { display: flex; align-items: center; gap: 0.5rem; }
    input[type=range] { flex: 1; accent-color: var(--accent1); }
    input[type=number] { width: 64px; padding: 0.3rem 0.4rem; border: 1.5px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text); background: var(--surface); outline: none; }
    input[type=number]:focus { border-color: var(--accent1); }
    .unit { font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

    .btn-primary {
      width: 100%; padding: 0.7rem; border-radius: 10px; border: none;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      color: #fff; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 800;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }

    .info-box { background: var(--surface2); border-radius: 8px; padding: 0.75rem; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-top: 0.75rem; }
    .info-box code { font-family: 'JetBrains Mono', monospace; color: var(--accent3); }

    /* 3D preview */
    .preview-panel { display: flex; flex-direction: column; }
    #canvas3d { width: 100%; aspect-ratio: 1; border-radius: 12px; background: linear-gradient(135deg, #fce8f4, #edf8f6); touch-action: none; }
    .preview-label { text-align: center; color: var(--text-muted); font-size: 0.78rem; margin-top: 0.5rem; font-family: 'JetBrains Mono', monospace; }
    .dims-row { display: flex; gap: 0.75rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .dim-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); }
    .dim-badge span { color: var(--accent1); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="logo">VG Generator</span>
      <span class="logo-sub">by <a href="https://tnks1407.com" style="color:var(--accent1);text-decoration:none;">TNKS1407</a></span>
    </div>
  </header>

  <main>
    <div class="panel">
      <h2>パラメータ設定</h2>
      <div class="tabs">
        <button class="tab active" id="tab-rect" onclick="setShape('rect')">Rect Vane</button>
        <button class="tab" id="tab-delta" onclick="setShape('delta')">Delta Wedge</button>
      </div>

      <div id="params-rect">
        <div class="field">
          <label>L — 長さ</label>
          <div class="field-row">
            <input type="range" id="L" min="5" max="100" value="30" step="1" oninput="syncNum('L')">
            <input type="number" id="L_n" value="30" min="1" max="200" oninput="syncRange('L')">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="field">
          <label>Wbase — 底面幅</label>
          <div class="field-row">
            <input type="range" id="Wbase" min="2" max="60" value="20" step="0.5" oninput="syncNum('Wbase')">
            <input type="number" id="Wbase_n" value="20" min="1" max="100" step="0.5" oninput="syncRange('Wbase')">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="field">
          <label>Ttop — 上辺厚み</label>
          <div class="field-row">
            <input type="range" id="Ttop" min="0.5" max="20" value="2.4" step="0.1" oninput="syncNum('Ttop')">
            <input type="number" id="Ttop_n" value="2.4" min="0.1" max="50" step="0.1" oninput="syncRange('Ttop')">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="field">
          <label>H — 高さ</label>
          <div class="field-row">
            <input type="range" id="H_rect" min="1" max="30" value="5" step="0.5" oninput="syncNum('H_rect')">
            <input type="number" id="H_rect_n" value="5" min="0.5" max="60" step="0.5" oninput="syncRange('H_rect')">
            <span class="unit">mm</span>
          </div>
        </div>
      </div>

      <div id="params-delta" style="display:none">
        <div class="field">
          <label>L — 長さ</label>
          <div class="field-row">
            <input type="range" id="Ld" min="5" max="100" value="30" step="1" oninput="syncNum('Ld')">
            <input type="number" id="Ld_n" value="30" min="1" max="200" oninput="syncRange('Ld')">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="field">
          <label>W — 底面幅</label>
          <div class="field-row">
            <input type="range" id="Wd" min="2" max="60" value="26" step="0.5" oninput="syncNum('Wd')">
            <input type="number" id="Wd_n" value="26" min="1" max="100" step="0.5" oninput="syncRange('Wd')">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="field">
          <label>Tb — ベース厚み</label>
          <div class="field-row">
            <input type="range" id="Tb" min="0.5" max="10" value="1.2" step="0.1" oninput="syncNum('Tb')">
            <input type="number" id="Tb_n" value="1.2" min="0.1" max="20" step="0.1" oninput="syncRange('Tb')">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="field">
          <label>H — 高さ</label>
          <div class="field-row">
            <input type="range" id="H_delta" min="1" max="30" value="7" step="0.5" oninput="syncNum('H_delta')">
            <input type="number" id="H_delta_n" value="7" min="0.5" max="60" step="0.5" oninput="syncRange('H_delta')">
            <span class="unit">mm</span>
          </div>
        </div>
      </div>

      <hr class="divider" />
      <button class="btn-primary" onclick="generate()">STLを生成してダウンロード</button>
      <div class="info-box">
        <code>numpy</code>・<code>trimesh</code> 不要。ブラウザで完結。<br>
        生成されたSTLはそのまま3Dプリンターで使用できます。
      </div>
    </div>

    <div class="panel preview-panel">
      <h2>プレビュー（ドラッグで回転）</h2>
      <canvas id="canvas3d"></canvas>
      <div class="preview-label" id="preview-label">Rect Vane</div>
      <div class="dims-row" id="dims-row"></div>
    </div>
  </main>

  <script>
    let shape = 'rect';

    function setShape(s) {
      shape = s;
      document.getElementById('params-rect').style.display = s === 'rect' ? '' : 'none';
      document.getElementById('params-delta').style.display = s === 'delta' ? '' : 'none';
      document.getElementById('tab-rect').classList.toggle('active', s === 'rect');
      document.getElementById('tab-delta').classList.toggle('active', s === 'delta');
      updatePreview();
    }

    function syncNum(id) {
      const r = document.getElementById(id);
      document.getElementById(id + '_n').value = r.value;
      updatePreview();
    }
    function syncRange(id) {
      const n = document.getElementById(id + '_n');
      document.getElementById(id).value = n.value;
      updatePreview();
    }
    function v(id) { return parseFloat(document.getElementById(id).value) || 0; }

    // ---- STL geometry ----

    function cross(a, b) {
      return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
    }
    function normalize(v) {
      const l = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) || 1;
      return [v[0]/l, v[1]/l, v[2]/l];
    }
    function faceNormal(p0, p1, p2) {
      const a = [p1[0]-p0[0], p1[1]-p0[1], p1[2]-p0[2]];
      const b = [p2[0]-p0[0], p2[1]-p0[1], p2[2]-p0[2]];
      return normalize(cross(a, b));
    }

    function stlFacet(p0, p1, p2) {
      const n = faceNormal(p0, p1, p2);
      return `  facet normal ${n[0].toFixed(6)} ${n[1].toFixed(6)} ${n[2].toFixed(6)}\n` +
        `    outer loop\n` +
        `      vertex ${p0[0].toFixed(4)} ${p0[1].toFixed(4)} ${p0[2].toFixed(4)}\n` +
        `      vertex ${p1[0].toFixed(4)} ${p1[1].toFixed(4)} ${p1[2].toFixed(4)}\n` +
        `      vertex ${p2[0].toFixed(4)} ${p2[1].toFixed(4)} ${p2[2].toFixed(4)}\n` +
        `    endloop\n  endfacet\n`;
    }

    function rectVaneTriangles(L, Wbase, Ttop, H) {
      const yb = Wbase / 2, yt = Ttop / 2;
      const v = [
        [0,  -yb, 0], [0,  yb, 0], [0,  yt, H], [0, -yt, H],
        [L,  -yb, 0], [L,  yb, 0], [L,  yt, H], [L, -yt, H],
      ];
      const tris = [
        [v[0],v[2],v[1]], [v[0],v[3],v[2]],   // x=0
        [v[4],v[5],v[6]], [v[4],v[6],v[7]],   // x=L
        [v[0],v[1],v[5]], [v[0],v[5],v[4]],   // bottom
        [v[3],v[6],v[2]], [v[3],v[7],v[6]],   // top
        [v[1],v[2],v[6]], [v[1],v[6],v[5]],   // +Y
        [v[0],v[4],v[7]], [v[0],v[7],v[3]],   // -Y
      ];
      return tris;
    }

    function deltaWedgeTriangles(L, W, Tb, H) {
      const y = W / 2;
      const v = [
        [0, -y, 0], [0, y, 0], [L, 0, 0],
        [0, -y, Tb], [0, y, Tb], [L, 0, Tb+H],
      ];
      const tris = [
        // bottom
        [v[0],v[1],v[2]],
        // top
        [v[3],v[5],v[4]],
        // back face (x=0)
        [v[0],v[3],v[4]], [v[0],v[4],v[1]],
        // -Y face
        [v[0],v[2],v[5]], [v[0],v[5],v[3]],
        // +Y face
        [v[1],v[4],v[5]], [v[1],v[5],v[2]],
      ];
      return tris;
    }

    function buildSTL(name, tris) {
      let s = `solid ${name}\n`;
      for (const [p0,p1,p2] of tris) s += stlFacet(p0,p1,p2);
      s += `endsolid ${name}\n`;
      return s;
    }

    function generate() {
      let tris, filename;
      if (shape === 'rect') {
        const L=v('L'), Wb=v('Wbase'), Tt=v('Ttop'), H=v('H_rect');
        tris = rectVaneTriangles(L, Wb, Tt, H);
        filename = `rect_L${L}_W${Wb}_T${Tt}_H${H}.stl`;
      } else {
        const L=v('Ld'), W=v('Wd'), Tb=v('Tb'), H=v('H_delta');
        tris = deltaWedgeTriangles(L, W, Tb, H);
        filename = `delta_L${L}_W${W}_Tb${Tb}_H${H}.stl`;
      }
      const stl = buildSTL('vg', tris);
      const blob = new Blob([stl], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }

    // ---- 3D Preview (simple WebGL-less canvas renderer) ----

    const canvas = document.getElementById('canvas3d');
    const ctx2 = canvas.getContext('2d');
    let rotX = 0.45, rotY = 0.7;
    let dragging = false, lastX, lastY;

    canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    canvas.addEventListener('mousemove', e => {
      if (!dragging) return;
      rotY += (e.clientX - lastX) * 0.01;
      rotX += (e.clientY - lastY) * 0.01;
      lastX = e.clientX; lastY = e.clientY;
      drawPreview();
    });
    canvas.addEventListener('mouseup', () => { dragging = false; });
    canvas.addEventListener('touchstart', e => { const t=e.touches[0]; dragging=true; lastX=t.clientX; lastY=t.clientY; e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t=e.touches[0];
      rotY += (t.clientX - lastX)*0.01;
      rotX += (t.clientY - lastY)*0.01;
      lastX=t.clientX; lastY=t.clientY;
      drawPreview(); e.preventDefault();
    }, {passive:false});
    canvas.addEventListener('touchend', () => { dragging=false; });

    function rot3(p) {
      let [x,y,z] = p;
      // rotate around Y
      let rx = x*Math.cos(rotY) + z*Math.sin(rotY);
      let rz = -x*Math.sin(rotY) + z*Math.cos(rotY);
      x=rx; z=rz;
      // rotate around X
      let ry = y*Math.cos(rotX) - z*Math.sin(rotX);
      rz = y*Math.sin(rotX) + z*Math.cos(rotX);
      return [x,ry,rz];
    }

    function drawPreview() {
      const W = canvas.width, H = canvas.height;
      ctx2.clearRect(0,0,W,H);

      let tris;
      if (shape === 'rect') {
        const L=v('L'), Wb=v('Wbase'), Tt=v('Ttop'), Hh=v('H_rect');
        tris = rectVaneTriangles(L, Wb, Tt, Hh);
        updateDims([`L=${L}mm`, `W=${Wb}mm`, `T=${Tt}mm`, `H=${Hh}mm`]);
        document.getElementById('preview-label').textContent = 'Rect Vane';
      } else {
        const L=v('Ld'), Wd=v('Wd'), Tb=v('Tb'), Hh=v('H_delta');
        tris = deltaWedgeTriangles(L, Wd, Tb, Hh);
        updateDims([`L=${L}mm`, `W=${Wd}mm`, `Tb=${Tb}mm`, `H=${Hh}mm`]);
        document.getElementById('preview-label').textContent = 'Delta Wedge';
      }

      // find bounding box for scaling
      let minV=[Infinity,Infinity,Infinity], maxV=[-Infinity,-Infinity,-Infinity];
      for (const [p0,p1,p2] of tris) {
        for (const p of [p0,p1,p2]) {
          const r = rot3(p);
          for (let i=0;i<3;i++) { minV[i]=Math.min(minV[i],r[i]); maxV[i]=Math.max(maxV[i],r[i]); }
        }
      }
      const span = Math.max(maxV[0]-minV[0], maxV[1]-minV[1], 1);
      const scale = (Math.min(W,H) * 0.7) / span;
      const cx = W/2, cy = H/2;

      function proj(p) {
        const [rx,ry] = rot3(p);
        return [cx + rx*scale, cy - ry*scale];
      }

      // Sort triangles by depth (painter's algorithm)
      const sorted = tris.map(([p0,p1,p2]) => {
        const [,,z0]=rot3(p0), [,,z1]=rot3(p1), [,,z2]=rot3(p2);
        return { tris: [p0,p1,p2], z: (z0+z1+z2)/3 };
      }).sort((a,b) => a.z - b.z);

      for (const { tris: [p0,p1,p2] } of sorted) {
        const n = faceNormal(rot3(p0), rot3(p1), rot3(p2));
        const light = Math.max(0.25, 0.25 + n[1]*0.5 - n[2]*0.3);
        const r=Math.round(200*light), g=Math.round(130*light), b=Math.round(192*light);
        const [x0,y0]=proj(p0), [x1,y1]=proj(p1), [x2,y2]=proj(p2);
        ctx2.beginPath();
        ctx2.moveTo(x0,y0); ctx2.lineTo(x1,y1); ctx2.lineTo(x2,y2);
        ctx2.closePath();
        ctx2.fillStyle = `rgb(${r},${g},${b})`;
        ctx2.fill();
        ctx2.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx2.lineWidth = 0.5;
        ctx2.stroke();
      }
    }

    function updateDims(labels) {
      const row = document.getElementById('dims-row');
      row.innerHTML = labels.map(l => {
        const [k,...vs] = l.split('=');
        return `<div class="dim-badge">${k}=<span>${vs.join('=')}</span></div>`;
      }).join('');
    }

    function updatePreview() { drawPreview(); }

    function resizeCanvas() {
      const r = canvas.parentElement.getBoundingClientRect();
      const sz = Math.min(r.width - 48, 480);
      canvas.width = sz; canvas.height = sz;
      drawPreview();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Listen to all inputs
    document.querySelectorAll('input').forEach(el => el.addEventListener('input', updatePreview));
  </script>
</body>
</html>
